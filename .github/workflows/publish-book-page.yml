name: Publish Maleyati book page

on:
  push:
    branches: [main]
    paths:
      - 'books/**'
      - '.github/workflows/publish-book-page.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only the public book landing page and catalog
        uses: actions/upload-pages-artifact@v3
        with:
          path: books
      - name: Publish book page
        id: deployment
        uses: actions/deploy-pages@v4
